name: Update profile stats

on:
  schedule:
    - cron: "50 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Refresh the numbers
        # All or nothing: on any failure card.json is left as it was and the
        # run fails here, so nothing below publishes a half-fresh card.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -u refresh.py
      - name: Rebuild the cards
        run: python3 tools/build_card.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg card.json metrics_history.json
          git diff --cached --quiet || (git commit -m "chore: refresh profile stats" && git push)
